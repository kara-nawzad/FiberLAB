<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — FiberLAB</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#fff4e6" />
    <link rel="icon" href="/FiberLab/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --ink: #231712;
        --mut: #85695a;
        --line: #eed8bf;
        --panel: #fffaf2;
        --pri: #e4673f;
        --pri-text: #b8471f;
        --cta: #c8512c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(120% 90% at 50% 0%, #fffaf2 0%, #fff4e6 55%, #f7e6d0 100%);
        color: var(--ink);
        font-family:
          Manrope,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      main {
        width: min(520px, 100%);
        padding: 32px 24px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--panel);
        box-shadow: 0 24px 60px rgba(43, 26, 20, 0.14);
      }
      .mark {
        display: inline-grid;
        width: 44px;
        height: 44px;
        place-items: center;
        border-radius: 12px;
        background: var(--pri);
      }
      .eyebrow {
        margin: 16px 0 0;
        color: var(--pri-text);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }
      h1 {
        margin: 6px 0 10px;
        font-size: 22px;
        line-height: 1.2;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 20px;
        color: var(--mut);
        font-size: 13px;
        line-height: 1.6;
      }
      a.button {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        padding: 0 18px;
        border-radius: 999px;
        background: var(--cta);
        color: #fff;
        font-size: 13px;
        font-weight: 700;
        text-decoration: none;
      }
      a.button:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="26" height="26" focusable="false">
          <path
            d="M12 44h10l6-24 6 24h18"
            fill="none"
            stroke="#fff4e6"
            stroke-width="5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </span>
      <p class="eyebrow">404 · no light at this port</p>
      <h1>That route isn’t spliced</h1>
      <p>
        The page you asked for doesn’t exist in FiberLAB. The workbench runs entirely in the browser, so nothing was
        lost — head back to the studio and carry on where you left off.
      </p>
      <a class="button" href="https://karanawzad.tech/FiberLab/">Back to FiberLAB</a>
    </main>
  </body>
</html>
